<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Downloader</title>
<style>
  :root { --bg:#fff; --fg:#111; --card:#f3f3f5; --acc:#fe2c55; --mut:#777; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e10; --fg:#f2f2f2; --card:#1b1b1f; --mut:#999; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); padding:20px 16px; max-width:480px; margin-inline:auto; }
  h1 { font-size:22px; margin:0 0 16px; }
  input { width:100%; padding:14px; font-size:16px; border-radius:12px; border:1px solid var(--mut); background:var(--card); color:var(--fg); }
  .row { display:flex; gap:8px; margin-top:10px; }
  button, a.btn { flex:1; padding:14px; font-size:16px; border:0; border-radius:12px; background:var(--acc); color:#fff; text-align:center; text-decoration:none; cursor:pointer; font-weight:600; }
  button.sec { background:var(--card); color:var(--fg); }
  button:disabled { opacity:.5; }
  #res { margin-top:18px; background:var(--card); border-radius:16px; padding:14px; display:none; }
  #res img { width:100%; border-radius:12px; max-height:320px; object-fit:cover; }
  #title { margin:10px 0; font-size:14px; }
  #msg { margin-top:14px; color:var(--mut); font-size:14px; min-height:20px; }
  .col { display:flex; flex-direction:column; gap:8px; }
</style>
</head>
<body>
<h1>TikTok Downloader</h1>
<input id="url" type="url" placeholder="Colle le lien TikTok ici" autocomplete="off">
<div class="row">
  <button id="paste" class="sec">Coller</button>
  <button id="go">Chercher</button>
</div>
<div id="msg"></div>

<div id="res">
  <img id="cover" alt="">
  <div id="title"></div>
  <div class="col">
    <button id="dlHd">Télécharger la vidéo (HD)</button>
    <button id="dlSd" class="sec">Vidéo qualité normale</button>
    <button id="dlMp3" class="sec">Audio seulement (MP3)</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const API = "https://www.tikwm.com";
let info = null;

const abs = u => !u ? null : (u.startsWith("http") ? u : API + u);
const say = t => $("msg").textContent = t;

$("paste").onclick = async () => {
  try { $("url").value = (await navigator.clipboard.readText()).trim(); }
  catch { say("Colle le lien à la main (accès presse-papier refusé)."); }
};

$("go").onclick = async () => {
  const link = $("url").value.trim();
  if (!/tiktok\.com/.test(link)) return say("Lien TikTok invalide.");
  $("go").disabled = true; $("res").style.display = "none"; say("Recherche…");
  try {
    const r = await fetch(`${API}/api/?hd=1&url=${encodeURIComponent(link)}`);
    const j = await r.json();
    if (j.code !== 0 || !j.data) throw new Error(j.msg || "Vidéo introuvable");
    info = j.data;
    $("cover").src = abs(info.cover);
    $("title").textContent = `@${info.author?.unique_id || "?"} — ${info.title || ""}`;
    $("dlHd").style.display = info.hdplay ? "" : "none";
    $("res").style.display = "block";
    say("");
  } catch (e) {
    say("Erreur : " + e.message);
  } finally { $("go").disabled = false; }
};

async function save(url, name) {
  url = abs(url);
  say("Téléchargement…");
  try {
    const blob = await (await fetch(url)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    say("✅ Terminé !");
  } catch {
    // Si le navigateur bloque, on ouvre le fichier directement (appui long → Télécharger)
    window.open(url, "_blank");
    say("Ouvert dans un nouvel onglet : appui long → Télécharger.");
  }
}

const base = () => `${info.author?.unique_id || "tiktok"}_${info.id}`;
$("dlHd").onclick  = () => save(info.hdplay, base() + ".mp4");
$("dlSd").onclick  = () => save(info.play,   base() + ".mp4");
$("dlMp3").onclick = () => save(info.music,  base() + ".mp3");
</script>
</body>
</html>
